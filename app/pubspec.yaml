name: nona
description: "Nona — Sudoku del día. Parte de Juegos Senda."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Identidad compartida. Estas tres van ya —antes que el paquete
  # juegos_senda— porque hacen falta para la verificación A4: comprobar que la
  # misma cuenta de Apple produce el MISMO uid de Firebase en CINCO y en Nona.
  # Es lo que sostiene todo el diseño de cuentas compartidas y ningún documento
  # de Apple lo afirma con claridad, así que se mide.
  crypto: ^3.0.7
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  sign_in_with_apple: ^8.1.0

  # Estado local de la partida: la diaria tiene que poder jugarse sin red.
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Genera AppLocalizations desde lib/l10n/*.arb (ver l10n.yaml).
  generate: true

  assets:
    # Banco diario horneado (tools/bake_bank.dart). Va DENTRO del binario a
    # propósito: el diario tiene que existir sin red.
    - assets/bank/
