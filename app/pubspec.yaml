name: nona
description: "Nona — Sudoku del día. Parte de Juegos Senda."
publish_to: 'none'
# 1.0.5 y no otra build de la 1.0.4: la 1.0.4 (32) está en revisión de Apple
# con el arreglo del resultado, que es urgente, y esto es mucho más grande. Así
# la 1.0.4 sale sola y esto se prueba antes de enviarlo.
#
# Qué lleva la 1.0.5 respecto a la 32: el final de la diaria en escenas y
# «Quitar anuncios» fuera de Más, los dos copiados de CINCO 1.9 (24-9-2026), y
# «Recordar» en las rachas de amigos. La 35 añade a la 34 (André, 5-10-2026): el
# paquete 0.86.0 con los anuncios a pantalla completa, «Califica Nona», «Otros
# Juegos Senda», la privacidad de anuncios, «Bloqueados» y la Social con rachas
# y empujones; el numpad que no se salta cifras; y la diaria a medias que viaja
# con la cuenta. La 1.0.5 no se ha enviado a revisión, así que sigue siendo ella.
version: 1.0.5+35

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Plataforma compartida de Juegos Senda: identidad, amistades, clasificación,
  # ajustes, anuncios y compras. Se fija por TAG y nunca por rama — hay builds
  # en tiendas que dependen de que lo etiquetado hoy siga siendo lo mismo
  # mañana—, y `path:` porque en ese repo conviven el paquete y el backend.
  juegos_senda:
    git:
      url: https://github.com/agspr/juegos-senda.git
      ref: package-v0.86.0
      path: package

  # Firebase Core se declara aquí porque main() lo inicializa; el resto de la
  # identidad (auth, amistades, avisos) llega por juegos_senda.
  firebase_core: ^4.13.0

  # La diaria a medias se guarda en la nube para seguirla en otro teléfono
  # (lib/services/partida_en_la_nube.dart). Ya venía con el paquete; se declara
  # porque Nona la usa ella misma, con la misma restricción que el paquete.
  cloud_firestore: ^6.8.0

  # «Actualizar» abre la ficha de la tienda. Ya venía con el paquete; se
  # declara porque Nona la importa ella misma.
  url_launcher: ^6.3.2

  # Telemetría (regla de familia, igual que CINCO): las tres se declaran e
  # inicializan en CADA juego. Ya viajan por transitividad con el paquete, así
  # que el coste de no declararlas no es que falte una función: es que los
  # eventos de Analytics y los crashes se pierden EN SILENCIO — compila, corre,
  # y no mide nada.
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7
  sentry_flutter: ^9.26.0

  # Lo usan el horneado del banco y su auditoría (sha256 del manifest), no la
  # app en tiempo de ejecución.
  crypto: ^3.0.7

  # Estado local de la partida: la diaria tiene que poder jugarse sin red.
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sentry_dart_plugin: ^3.4.0

flutter:
  uses-material-design: true
  # Genera AppLocalizations desde lib/l10n/*.arb (ver l10n.yaml).
  generate: true

  assets:
    # Banco diario horneado (tools/bake_bank.dart). Va DENTRO del binario a
    # propósito: el diario tiene que existir sin red.
    - assets/bank/
    # Los iconos de los otros Juegos Senda, para «Otros Juegos Senda» en Más.
    - assets/juegos/

# Subida de símbolos a Sentry (org senda-6q / proyecto nona).
# Requiere SENTRY_AUTH_TOKEN en el entorno; se ejecuta tras el build de release:
#   flutter build ipa --obfuscate --split-debug-info=build/symbols
#   dart run sentry_dart_plugin
sentry:
  project: nona
  org: senda-6q
  upload_debug_symbols: true
  upload_source_maps: false
